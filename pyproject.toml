[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-neuron-v22"
version = "0.1.0"
description = "External morphology/operator tests for the Geometric Neuron line"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
morphology = ["neurom==3.2.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["geometric_neuron_v22*"]
