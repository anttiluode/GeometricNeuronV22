name: fci-morphology-smoke

on:
  push:
    paths:
      - "geometric_neuron_v22/**"
      - "scripts/extract_morphology_features.py"
      - "scripts/probe_neuromorpho_mohan.py"
      - "scripts/recover_mohan_neuromorpho.py"
      - "pyproject.toml"
      - ".github/workflows/fci-morphology-smoke.yml"
  workflow_dispatch:

jobs:
  external-morphology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install V22 morphology dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[morphology]'
      - name: Fetch authors' public FCI repository
        run: |
          git clone --depth=1 https://github.com/ido4848/FCI.git external/FCI
          find external/FCI/simulating_neurons/neuron_models -type f -name '*.asc' -print | sort
      - name: Probe NeuroMorpho for Mohan Table-S1 cells
        run: python scripts/probe_neuromorpho_mohan.py
      - name: Recover public Mohan source morphologies
        run: |
          mkdir -p artifacts
          python scripts/recover_mohan_neuromorpho.py \
            --work-dir external/mohan \
            --receipt artifacts/mohan_source_features.json
      - name: Extract label-free V22 features
        run: |
          python scripts/extract_morphology_features.py \
            external/FCI/simulating_neurons/neuron_models \
            --csv artifacts/fci_morphology_features.csv \
            --json artifacts/fci_morphology_features.json
      - name: Cross-check ordinary features against NeuroM
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import neurom as nm
          from neurom.features import neurite as nf

          rows = json.load(open('artifacts/fci_morphology_features.json', encoding='utf-8'))
          for row in rows:
              morph = nm.load_morphology(row['path'])
              dendrites = [n for n in morph.neurites if n.type != nm.AXON]
              reference = {
                  'total_dendritic_length': sum(nf.total_length(n) for n in dendrites),
                  'total_dendritic_area': sum(nf.total_area(n) for n in dendrites),
                  'number_of_bifurcations': sum(nf.number_of_bifurcations(n) for n in dendrites),
                  'number_of_leaves': sum(nf.number_of_leaves(n) for n in dendrites),
                  'longest_root_to_tip_path': max(
                      value
                      for n in dendrites
                      for value in nf.terminal_path_lengths(n)
                  ),
              }
              print(row['file'])
              for key, expected in reference.items():
                  observed = row[key]
                  print(f'  {key}: v22={observed} neurom={expected}')
                  if isinstance(expected, (int, np.integer)):
                      if observed != int(expected):
                          raise SystemExit(f'{row["file"]}: mismatch in {key}')
                  elif not np.isclose(observed, expected, rtol=1e-6, atol=1e-6):
                      raise SystemExit(f'{row["file"]}: mismatch in {key}')
          PY
      - name: Audit morphology count
        run: |
          python - <<'PY'
          import json
          rows = json.load(open('artifacts/fci_morphology_features.json', encoding='utf-8'))
          print('public author morphology files processed:', len(rows))
          if len(rows) < 4:
              raise SystemExit('expected at least the four morphology files observed during data audit')
          source = json.load(open('artifacts/mohan_source_features.json', encoding='utf-8'))
          print('Mohan source morphologies recovered:', len(source))
          if len(source) != 5:
              raise SystemExit('expected five NeuroMorpho Mohan source files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fci-morphology-smoke
          path: artifacts/
