name: recover-allen-morphologies

on:
  push:
    paths:
      - "scripts/recover_allen_table_s1.py"
      - ".github/workflows/recover-allen-morphologies.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install recovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[morphology]' allensdk
      - name: Recover six Allen Table-S1 morphologies
        run: |
          python scripts/recover_allen_table_s1.py \
            --work-dir data/allen \
            --receipt artifacts/allen_recovery.json
      - name: Require six recovered specimens
        run: |
          python - <<'PY'
          import json
          rows = json.load(open('artifacts/allen_recovery.json', encoding='utf-8'))
          print('recovered:', len(rows))
          if len(rows) != 6:
              raise SystemExit('expected all six Allen Table-S1 specimens')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: allen-recovery-receipt
          path: artifacts/allen_recovery.json
