name: recover-allen-morphologies

on:
  push:
    paths:
      - "scripts/recover_allen_table_s1.py"
      - "scripts/probe_allen_identifiers.py"
      - ".github/workflows/recover-allen-morphologies.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install morphology dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[morphology]'
      - name: Probe current Allen RMA identifier types
        run: python scripts/probe_allen_identifiers.py
      - name: Recover Allen Table-S1 morphologies currently resolvable as specimens
        id: recover
        continue-on-error: true
        run: |
          python scripts/recover_allen_table_s1.py \
            --work-dir data/allen \
            --receipt artifacts/allen_recovery.json
      - name: Show partial receipt
        if: always()
        run: |
          if [ -f artifacts/allen_recovery.json ]; then
            cat artifacts/allen_recovery.json
          else
            echo "Recovery script aborted before writing a receipt."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allen-recovery-receipt
          path: artifacts/
          if-no-files-found: warn
