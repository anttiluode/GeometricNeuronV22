name: fetch-aizenbud-supplement

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_aizenbud_supplement.py'
      - '.github/workflows/fetch-aizenbud-supplement.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - name: Fetch and inspect supplement
        run: python scripts/fetch_aizenbud_supplement.py --out-dir supplement_receipt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aizenbud-supplement-receipt
          path: supplement_receipt/
