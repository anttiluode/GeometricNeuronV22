name: secondary-resolved16-gate

on:
  push:
    paths:
      - "scripts/run_secondary_resolved16_gate.py"
      - "data/frozen_panel_v01.csv"
      - "data/fci_targets_fig2.csv"
      - ".github/workflows/secondary-resolved16-gate.yml"
  workflow_dispatch:

jobs:
  run-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - run: python scripts/run_secondary_resolved16_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: secondary-resolved16-result
          path: artifacts/secondary_resolved16_result.json
